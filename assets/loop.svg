<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="The loop: see something interesting, get curious, break it apart, rebuild it, keep or discard, repeat forever" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <radialGradient id="pg" cx="50%" cy="55%" r="60%"><stop offset="0" stop-color="#241447"/><stop offset="1" stop-color="#0b0816"/></radialGradient>
  <radialGradient id="dg"><stop offset="0" stop-color="#F5D08A" stop-opacity=".9"/><stop offset="1" stop-color="#F5D08A" stop-opacity="0"/></radialGradient>
  <path id="orbit" d="M450,100 A122,122 0 0 1 450,344 A122,122 0 0 1 450,100 Z"/>
</defs>
<rect width="900" height="400" rx="24" fill="url(#pg)"/>
<rect x=".5" y=".5" width="899" height="399" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<text x="36" y="44" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" letter-spacing="2" fill="#A78BFA" fill-opacity=".6">// the loop</text>
<g transform-origin="450 222"><animateTransform attributeName="transform" type="rotate" from="0 450 222" to="360 450 222" dur="60s" repeatCount="indefinite"/>
  <circle cx="450" cy="222" r="156" fill="none" stroke="#A78BFA" stroke-opacity=".25" stroke-dasharray="1 13" stroke-linecap="round" stroke-width="2"/></g>
<circle cx="450" cy="222" r="122" fill="none" stroke="#7C3AED" stroke-opacity=".35" stroke-width="2"/>
<circle cx="450" cy="222" r="122" fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="3 12" stroke-linecap="round">
  <animate attributeName="stroke-dashoffset" from="0" to="-15" dur="1.2s" repeatCount="indefinite"/></circle>

<circle cx="450.0" cy="100.0" r="18" fill="none" stroke="#F5D08A" stroke-width="2" opacity="0">
  <animate attributeName="r" values="18;38;38" keyTimes="0;.22;1" dur="10s" begin="0s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".9;0;0" keyTimes="0;.22;1" dur="10s" begin="0s" repeatCount="indefinite"/></circle>
<circle cx="450.0" cy="100.0" r="18" fill="#1a1033" stroke="#7C3AED" stroke-width="2"/>
<text x="450.0" y="104.5" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#F5D08A">01</text>
<text x="450.0" y="50.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="19" font-weight="700" fill="#F5F3FF">see something interesting</text>
<text x="450.0" y="68.0" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="1" fill="#A78BFA" fill-opacity=".75">the spark</text>
<circle cx="566.0" cy="184.3" r="18" fill="none" stroke="#F5D08A" stroke-width="2" opacity="0">
  <animate attributeName="r" values="18;38;38" keyTimes="0;.22;1" dur="10s" begin="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".9;0;0" keyTimes="0;.22;1" dur="10s" begin="2s" repeatCount="indefinite"/></circle>
<circle cx="566.0" cy="184.3" r="18" fill="#1a1033" stroke="#7C3AED" stroke-width="2"/>
<text x="566.0" y="188.8" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#F5D08A">02</text>
<text x="598.0" y="182.3" text-anchor="start" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="19" font-weight="700" fill="#F5F3FF">get curious</text>
<text x="598.0" y="200.3" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="1" fill="#A78BFA" fill-opacity=".75">ask why, ask how</text>
<circle cx="521.7" cy="320.7" r="18" fill="none" stroke="#F5D08A" stroke-width="2" opacity="0">
  <animate attributeName="r" values="18;38;38" keyTimes="0;.22;1" dur="10s" begin="4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".9;0;0" keyTimes="0;.22;1" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
<circle cx="521.7" cy="320.7" r="18" fill="#1a1033" stroke="#7C3AED" stroke-width="2"/>
<text x="521.7" y="325.2" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#F5D08A">03</text>
<text x="553.7" y="318.7" text-anchor="start" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="19" font-weight="700" fill="#F5F3FF">break it apart</text>
<text x="553.7" y="336.7" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="1" fill="#A78BFA" fill-opacity=".75">poke at every piece</text>
<circle cx="378.3" cy="320.7" r="18" fill="none" stroke="#F5D08A" stroke-width="2" opacity="0">
  <animate attributeName="r" values="18;38;38" keyTimes="0;.22;1" dur="10s" begin="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".9;0;0" keyTimes="0;.22;1" dur="10s" begin="6s" repeatCount="indefinite"/></circle>
<circle cx="378.3" cy="320.7" r="18" fill="#1a1033" stroke="#7C3AED" stroke-width="2"/>
<text x="378.3" y="325.2" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#F5D08A">04</text>
<text x="346.3" y="318.7" text-anchor="end" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="19" font-weight="700" fill="#F5F3FF">rebuild it</text>
<text x="346.3" y="336.7" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="1" fill="#A78BFA" fill-opacity=".75">make it make sense</text>
<circle cx="334.0" cy="184.3" r="18" fill="none" stroke="#F5D08A" stroke-width="2" opacity="0">
  <animate attributeName="r" values="18;38;38" keyTimes="0;.22;1" dur="10s" begin="8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".9;0;0" keyTimes="0;.22;1" dur="10s" begin="8s" repeatCount="indefinite"/></circle>
<circle cx="334.0" cy="184.3" r="18" fill="#1a1033" stroke="#7C3AED" stroke-width="2"/>
<text x="334.0" y="188.8" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#F5D08A">05</text>
<text x="302.0" y="182.3" text-anchor="end" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="19" font-weight="700" fill="#F5F3FF">keep or discard</text>
<text x="302.0" y="200.3" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="1" fill="#A78BFA" fill-opacity=".75">no guilt either way</text>
<g><circle r="16" fill="url(#dg)"><animateMotion dur="10s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
<circle r="5.5" fill="#F5D08A"><animateMotion dur="10s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle></g>
<g transform="translate(450 216)"><g><animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="4s" repeatCount="indefinite"/>
  <text text-anchor="middle" y="18" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="64" fill="#F5D08A">∞</text></g></g>
<text x="450" y="256" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" letter-spacing="4" fill="#A78BFA">REPEAT FOREVER</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
